name: Deploy to Azure

# Deploys main to Azure after CI passes: the API to App Service, the web app to
# Static Web Apps. Every push deploys both, so nothing is skipped the way
# Railway's watch paths skipped pushes. Each job does nothing until its
# repository variables are set (Settings → Secrets and variables → Actions);
# what to set is in docs/plans/2026-10-25-azure-supabase-move.md.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-azure
  cancel-in-progress: false

jobs:
  api:
    if: vars.AZURE_WEBAPP_NAME != '' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build the API image in the registry
        run: az acr build --registry "${{ vars.AZURE_REGISTRY }}" --image "accounting-api:$SHA" --file deploy/azure/Dockerfile .
      - name: Run it on App Service
        # The container migrates the database, then starts; App Service's health
        # check on /health takes it out of service if it stops answering.
        run: >-
          az webapp config container set
          --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}"
          --name "${{ vars.AZURE_WEBAPP_NAME }}"
          --container-image-name "${{ vars.AZURE_REGISTRY }}.azurecr.io/accounting-api:$SHA"

  web:
    if: vars.API_ORIGIN != '' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --workspace @accounting/web --workspace @accounting/shared --include-workspace-root --no-audit --no-fund
      - run: npm -w @accounting/shared run build
      - run: npm -w @accounting/web run build
        env:
          VITE_API_URL: ${{ vars.API_ORIGIN }}
      - name: Azure's config, naming the API in the script policy
        run: sed "s#__API_ORIGIN__#${{ vars.API_ORIGIN }}#g" apps/web/staticwebapp.config.json > apps/web/dist/staticwebapp.config.json
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: apps/web/dist
          skip_app_build: true
          skip_api_build: true
